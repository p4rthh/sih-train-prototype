<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Navarail - Track Your Train</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#ffecee",
                        "surface": "#fff8f7",
                        "inverse-primary": "#ffb1c2",
                        "on-surface": "#26181b",
                        "secondary-fixed": "#ece1d3",
                        "on-secondary-fixed": "#201b13",
                        "primary-fixed-dim": "#ffb1c2",
                        "surface-variant": "#f6dce0",
                        "primary-container": "#d32f6a",
                        "inverse-surface": "#3c2c2f",
                        "on-secondary-fixed-variant": "#4d463c",
                        "on-tertiary": "#ffffff",
                        "outline": "#8d7075",
                        "surface-container": "#ffe8eb",
                        "on-background": "#26181b",
                        "on-tertiary-fixed": "#002108",
                        "tertiary-fixed-dim": "#70dd82",
                        "on-primary-container": "#fff7f7",
                        "background": "#fff8f7",
                        "on-tertiary-fixed-variant": "#00531f",
                        "error": "#ba1a1a",
                        "surface-dim": "#eed4d8",
                        "on-secondary-container": "#6b6358",
                        "secondary-container": "#ece1d3",
                        "tertiary": "#006929",
                        "surface-tint": "#b71456",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#8dfa9b",
                        "surface-container-high": "#fce2e6",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fff0f1",
                        "tertiary-container": "#008536",
                        "on-primary-fixed-variant": "#8f0040",
                        "on-tertiary-container": "#ecffe8",
                        "secondary-fixed-dim": "#d0c5b8",
                        "on-surface-variant": "#594045",
                        "primary": "#b10b52",
                        "on-primary-fixed": "#3f0018",
                        "primary-fixed": "#ffd9e0",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#f6dce0",
                        "surface-bright": "#fff8f7",
                        "secondary": "#655d53",
                        "outline-variant": "#e0bec4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "md": "16px",
                        "unit": "4px",
                        "xs": "4px",
                        "container-margin": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff8f7; /* bg-background */
        }
        /* Custom Arch Motif */
        .arch-header {
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
            background-color: #fce2e6; /* bg-surface-container-high */
            padding-bottom: 2rem;
        }
    </style>
</head>
<body class="bg-background text-on-background flex flex-col min-h-screen" style="background-color: rgb(248, 203, 200);">
<!-- TopAppBar from JSON -->
<header class="h-16 px-4 flex items-center justify-center rounded-b-[32px] w-full top-0 sticky shadow-sm z-40" style="background-color: rgb(253, 239, 222); border-bottom: 1px solid rgb(246, 220, 224);">
<div class="flex items-center justify-center w-full h-full"><h1 class="font-samarkan text-[28px] font-bold tracking-wider text-center leading-none" style="color: rgb(230, 57, 110); font-family: Samarkan, sans-serif; font-style: normal; font-weight: 800; letter-spacing: -0.02em;">Navarail</h1></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin pt-lg max-w-4xl mx-auto w-full pb-xl">
<!-- Search Section Header (Arch Motif) -->
<div class="arch-header mb-lg rounded-t-[32px] px-lg py-xl flex flex-col items-center justify-center relative overflow-hidden shadow-sm" style="background-color: rgb(252, 226, 230); border-bottom: 2px solid rgb(224, 190, 196);">
<div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.83-54.627 54.627-.83-.83L54.627 0zM29.627 0l.83.83-29.627 29.627-.83-.83L29.627 0zM0 29.627l.83.83L0 30.457V29.627z\' fill=\'%23b10b52\' fill-opacity=\'1\' fill-rule=\'evenodd\'/%3E%3C/svg%3E');"></div>
<h2 class="text-3xl md:text-5xl font-bold text-center z-10 tracking-wide drop-shadow-sm" style="color: rgb(38, 24, 27); font-family: 'Inter', sans-serif;">Where to?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center z-10">Track live status and schedules</p>
</div>
<!-- Search Tabs/Cards (Bento Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md relative -mt-12 z-20">
<!-- Train Number Search Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-lg shadow-sm border border-surface-variant flex flex-col gap-md" style="border-color: rgb(248, 203, 200); border-width: 1.5px; border-radius: 28px; background-color: rgb(253, 239, 222);">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="train" style="color: rgb(230, 57, 110);">train</span>
<h3 class="font-headline-md text-headline-md text-on-surface">By Train</h3>
</div>
<div class="relative">
<label class="font-label-bold text-label-bold text-on-surface-variant absolute -top-2 left-3 bg-surface-container-lowest px-1" for="train-number" style="background-color: rgb(253, 239, 222);">Train No. or Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-4 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="train-number" placeholder="e.g. 12952 or Rajdhani" type="text" style="background-color: rgb(253, 239, 222);">
</div>
<button class="w-full text-white font-headline-md text-headline-md py-4 rounded-full shadow-md hover:opacity-95 active:shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-sm" style="background-color: rgb(230, 57, 110);"><span class="">Search</span><span class="material-symbols-outlined" data-icon="search">search</span></button>
</div>
<!-- Station to Station Search Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-lg shadow-sm border border-surface-variant flex flex-col gap-md" style="border-color: rgb(248, 203, 200); border-width: 1.5px; border-radius: 28px; background-color: rgb(253, 239, 222);">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="route" style="color: rgb(230, 57, 110);">route</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Between Stations</h3>
</div>
</div>
<div class="relative flex flex-col gap-md">
<!-- From Input -->
<div class="relative">
<label class="font-label-bold text-label-bold text-on-surface-variant absolute -top-2 left-3 bg-surface-container-lowest px-1" for="station-from" style="background-color: rgb(253, 239, 222);">From Station</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-4 pl-12 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="station-from" placeholder="e.g. NDLS - New Delhi" type="text" style="background-color: rgb(253, 239, 222);">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
<!-- Swap Button & Timeline Line -->
<div class="absolute left-[23px] top-[48px] bottom-[48px] w-[2px] bg-outline-variant z-0 hidden sm:block"></div>
<button class="absolute right-4 top-1/2 -translate-y-1/2 bg-surface-container rounded-full p-2 text-primary shadow-sm border border-outline-variant hover:bg-primary-container/10 active:scale-90 transition-all z-10 sm:right-auto sm:left-[11px] sm:top-1/2 sm:-translate-y-1/2" style="background-color: rgb(248, 203, 200); color: rgb(230, 57, 110); border-color: rgb(224, 190, 196);">
<span class="material-symbols-outlined" data-icon="swap_vert">swap_vert</span>
</button>
<!-- To Input -->
<div class="relative">
<label class="font-label-bold text-label-bold text-on-surface-variant absolute -top-2 left-3 bg-surface-container-lowest px-1" for="station-to" style="background-color: rgb(253, 239, 222);">To Station</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-4 pl-12 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="station-to" placeholder="e.g. MMCT - Mumbai Central" type="text" style="background-color: rgb(253, 239, 222);">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary" data-icon="location_on" style="color: rgb(230, 57, 110);">location_on</span>
</div>
</div>
<button class="w-full text-white font-headline-md text-headline-md py-4 rounded-full shadow-md hover:opacity-95 active:shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-sm" style="background-color: rgb(230, 57, 110);"><span class="">Search</span><span class="material-symbols-outlined" data-icon="search">search</span></button>
</div>
</div>
<!-- Recently Searched Section -->
<section class="mt-xl">


</section>
</main>
<!-- BottomNavBar from JSON -->
<!-- WebKit scrollbar hiding for smooth horizontal scroll -->
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>








</body></html>
